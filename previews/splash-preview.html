<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rakshak 2.0 — Splash Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cyan: #06B6D4;
      --cyan-dark: #0891B2;
      --slate-50: #F8FAFC;
      --slate-400: #94A3B8;
      --slate-700: #334155;
      --slate-800: #1E293B;
      --slate-950: #020617;
      --slate-900: #0F172A;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; font-family: 'Space Grotesk', sans-serif; }

    .splash-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, #0F172A 0%, #020617 100%);
      overflow: hidden;
      transition: opacity 400ms ease-out;
    }
    .splash-screen.exit { opacity: 0; pointer-events: none; }

    /* Particles */
    .particles { position: absolute; inset: 0; pointer-events: none; }
    .particle {
      position: absolute;
      width: 2px; height: 2px;
      background: rgba(6, 182, 212, 0.6);
      border-radius: 50%;
      top: 50%; left: 50%;
      animation: particle-float 2.5s ease-out infinite;
      animation-delay: calc(var(--i) * 0.15s);
    }
    @keyframes particle-float {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
      20% { opacity: 1; }
      100% {
        transform: translate(
          calc(-50% + (cos(var(--i)) * 120px)),
          calc(-50% + (sin(var(--i)) * 80px))
        ) scale(0);
        opacity: 0;
      }
    }

    /* 3D Logo Stage */
    .logo-stage { perspective: 800px; perspective-origin: 50% 50%; }
    .logo-3d {
      transform-style: preserve-3d;
      animation: logo-entrance 1200ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes logo-entrance {
      0% { transform: rotateY(-90deg) rotateX(15deg) scale(0.6); opacity: 0; }
      60% { transform: rotateY(8deg) rotateX(-3deg) scale(1.05); opacity: 1; }
      100% { transform: rotateY(0deg) rotateX(0deg) scale(1); opacity: 1; }
    }

    /* Shield */
    .shield {
      position: relative;
      width: 160px; height: 180px;
      background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
      border: 2px solid rgba(6, 182, 212, 0.4);
      border-radius: 12px 12px 40px 40px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      box-shadow: 0 0 40px rgba(6, 182, 212, 0.15), inset 0 0 20px rgba(6, 182, 212, 0.05);
      transform-style: preserve-3d;
    }
    .glow-ring {
      position: absolute; inset: -8px;
      border: 1px solid rgba(6, 182, 212, 0.3);
      border-radius: 16px 16px 44px 44px;
      animation: glow-pulse 2s ease-in-out infinite;
    }
    @keyframes glow-pulse {
      0%, 100% { box-shadow: 0 0 20px rgba(6, 182, 212, 0.2); }
      50% { box-shadow: 0 0 40px rgba(6, 182, 212, 0.4); }
    }

    .brackets {
      display: flex; gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 28px; font-weight: 700;
      color: #06B6D4; margin-bottom: 4px;
    }
    .bracket.left {
      animation: bracket-left 1200ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0; transform: translateX(-20px);
    }
    .bracket.right {
      animation: bracket-right 1200ms cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
      opacity: 0; transform: translateX(20px);
    }
    @keyframes bracket-left { to { opacity: 1; transform: translateX(0); } }
    @keyframes bracket-right { to { opacity: 1; transform: translateX(0); } }

    .bindu {
      width: 8px; height: 8px;
      background: #06B6D4; border-radius: 50%;
      margin: 4px 0 8px;
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.6);
      animation: bindu-pop 600ms cubic-bezier(0.34, 1.56, 0.64, 1) 0.6s both;
      transform: scale(0);
    }
    @keyframes bindu-pop { to { transform: scale(1); } }

    .logo-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 20px; font-weight: 700;
      letter-spacing: 4px; color: #F8FAFC;
      margin-top: 8px;
      animation: text-reveal 800ms ease-out 0.8s both;
      clip-path: inset(0 100% 0 0);
    }
    @keyframes text-reveal { to { clip-path: inset(0 0% 0 0); } }

    .logo-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px; font-weight: 500;
      color: #06B6D4; letter-spacing: 2px;
      margin-top: 2px;
      animation: fade-in 600ms ease-out 1.1s both;
      opacity: 0;
    }
    @keyframes fade-in { to { opacity: 1; } }

    .tagline {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px; color: #94A3B8;
      letter-spacing: 1px; margin-top: 24px;
      animation: fade-in 600ms ease-out 1.3s both;
      opacity: 0;
    }

    .loading-track {
      position: absolute; bottom: 60px;
      width: 120px; height: 2px;
      background: rgba(51, 65, 85, 0.5);
      border-radius: 2px; overflow: hidden;
    }
    .loading-fill {
      height: 100%;
      background: linear-gradient(90deg, #06B6D4, #0891B2);
      border-radius: 2px;
      animation: loading-progress 2.1s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      width: 0;
    }
    @keyframes loading-progress { 0% { width: 0; } 100% { width: 100%; } }

    .splash-screen.exit .logo-3d {
      animation: logo-exit 400ms cubic-bezier(0.4, 0, 1, 1) forwards;
    }
    @keyframes logo-exit {
      to { transform: scale(0.9) translateY(-20px); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .splash-screen { transition: none; }
      .logo-3d, .bracket.left, .bracket.right, .bindu, .logo-text, .logo-sub, .tagline, .loading-fill, .particle, .glow-ring {
        animation: none !important; opacity: 1 !important; transform: none !important; clip-path: none !important;
      }
      .loading-fill { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="splash-screen" id="splash">
    <div class="particles">
      <span class="particle" style="--i:0"></span>
      <span class="particle" style="--i:1"></span>
      <span class="particle" style="--i:2"></span>
      <span class="particle" style="--i:3"></span>
      <span class="particle" style="--i:4"></span>
      <span class="particle" style="--i:5"></span>
      <span class="particle" style="--i:6"></span>
      <span class="particle" style="--i:7"></span>
      <span class="particle" style="--i:8"></span>
      <span class="particle" style="--i:9"></span>
      <span class="particle" style="--i:10"></span>
      <span class="particle" style="--i:11"></span>
    </div>
    <div class="logo-stage">
      <div class="logo-3d">
        <div class="shield">
          <div class="glow-ring"></div>
          <div class="brackets">
            <span class="bracket left">{<</span>
            <span class="bracket right">>}</span>
          </div>
          <div class="bindu"></div>
          <div class="logo-text">RAKSHAK</div>
          <div class="logo-sub">2.0</div>
        </div>
      </div>
    </div>
    <p class="tagline">Your brand's local guardian</p>
    <div class="loading-track"><div class="loading-fill"></div></div>
  </div>

  <script>
    // Auto-exit after 2.5s
    setTimeout(() => {
      document.getElementById('splash').classList.add('exit');
      setTimeout(() => {
        document.getElementById('splash').style.display = 'none';
      }, 400);
    }, 2500);
  </script>
</body>
</html>
