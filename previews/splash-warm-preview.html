<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rakshak 2.0 — 3D Smooth Intro (Warm)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --white: #FFFFFF;
      --cream: #FAF7F2;
      --warm-bg: #F5F0E8;
      --brown-light: #A67C52;
      --brown: #8B6F47;
      --brown-dark: #6B5335;
      --orange: #E8913A;
      --orange-light: #F0A85A;
      --orange-glow: rgba(232, 145, 58, 0.25);
      --text-dark: #2C2416;
      --text-mid: #6B5335;
      --text-light: #9B8568;
      --shadow-warm: rgba(139, 111, 71, 0.15);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; font-family: 'Space Grotesk', sans-serif; background: #FAF7F2; }

    .splash-screen {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(135deg, #FAF7F2 0%, #F5F0E8 50%, #FFF8F0 100%);
      overflow: hidden;
      transition: opacity 600ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    .splash-screen.exit { opacity: 0; pointer-events: none; }

    /* ─── Background Layers (3D depth) ───────────────────── */
    .bg-layer {
      position: absolute; inset: 0; pointer-events: none;
      transform-style: preserve-3d;
    }
    .bg-gradient-orb {
      position: absolute;
      width: 500px; height: 500px;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      animation: orb-drift 6s ease-in-out infinite;
    }
    .bg-gradient-orb.orange {
      background: radial-gradient(circle, rgba(232, 145, 58, 0.4) 0%, transparent 70%);
      top: -100px; right: -100px;
    }
    .bg-gradient-orb.brown {
      background: radial-gradient(circle, rgba(139, 111, 71, 0.3) 0%, transparent 70%);
      bottom: -150px; left: -150px;
      animation-delay: -3s;
    }
    @keyframes orb-drift {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -20px) scale(1.05); }
      66% { transform: translate(-20px, 15px) scale(0.95); }
    }

    /* Floating shapes (3D parallax) */
    .floating-shape {
      position: absolute;
      border-radius: 50%;
      opacity: 0.08;
      animation: shape-float 5s ease-in-out infinite;
    }
    .floating-shape.s1 { width: 80px; height: 80px; background: var(--orange); top: 15%; left: 10%; animation-delay: 0s; }
    .floating-shape.s2 { width: 50px; height: 50px; background: var(--brown); top: 70%; right: 15%; animation-delay: -1.5s; }
    .floating-shape.s3 { width: 120px; height: 120px; background: var(--orange-light); top: 20%; right: 8%; animation-delay: -3s; }
    .floating-shape.s4 { width: 40px; height: 40px; background: var(--brown-light); bottom: 25%; left: 12%; animation-delay: -2s; }
    @keyframes shape-float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      25% { transform: translateY(-15px) rotate(5deg); }
      50% { transform: translateY(-8px) rotate(-3deg); }
      75% { transform: translateY(-20px) rotate(2deg); }
    }

    /* ─── Particles (warm) ───────────────────────────────── */
    .particles { position: absolute; inset: 0; pointer-events: none; }
    .particle {
      position: absolute; width: 4px; height: 4px;
      background: var(--orange);
      border-radius: 50%;
      top: 50%; left: 50%;
      animation: particle-float 3s ease-out infinite;
      animation-delay: calc(var(--i) * 0.18s);
      box-shadow: 0 0 8px var(--orange-glow);
      opacity: 0;
    }
    @keyframes particle-float {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
      10% { opacity: 0.8; }
      100% {
        transform: translate(
          calc(-50% + (cos(var(--i) * 0.5236) * 180px)),
          calc(-50% + (sin(var(--i) * 0.5236) * 120px))
        ) scale(0);
        opacity: 0;
      }
    }

    /* ─── 3D Logo Stage ──────────────────────────────────── */
    .logo-stage {
      perspective: 1200px;
      perspective-origin: 50% 45%;
      margin-bottom: 24px;
      position: relative;
    }
    .logo-3d {
      transform-style: preserve-3d;
      animation: logo-entrance 1600ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
      position: relative;
    }
    @keyframes logo-entrance {
      0% { 
        transform: rotateY(-150deg) rotateX(25deg) rotateZ(-10deg) scale(0.4) translateZ(-200px); 
        opacity: 0; 
        filter: blur(12px);
      }
      40% { 
        transform: rotateY(15deg) rotateX(-5deg) rotateZ(3deg) scale(1.12) translateZ(20px); 
        opacity: 1; 
        filter: blur(0);
      }
      70% { 
        transform: rotateY(-5deg) rotateX(2deg) rotateZ(-1deg) scale(1.02) translateZ(0px); 
      }
      100% { 
        transform: rotateY(0deg) rotateX(0deg) rotateZ(0deg) scale(1) translateZ(0px); 
        opacity: 1; 
        filter: blur(0);
      }
    }

    /* Logo container with layered depth */
    .logo-container {
      position: relative;
      width: 240px; height: 240px;
      display: flex; align-items: center; justify-content: center;
      transform-style: preserve-3d;
    }

    /* Back shadow layer (3D depth) */
    .logo-shadow {
      position: absolute; inset: 0;
      background: radial-gradient(circle, rgba(139, 111, 71, 0.2) 0%, transparent 60%);
      transform: translateZ(-30px) scale(1.1);
      filter: blur(20px);
      animation: shadow-pulse 3s ease-in-out infinite;
    }
    @keyframes shadow-pulse {
      0%, 100% { opacity: 0.5; transform: translateZ(-30px) scale(1.1); }
      50% { opacity: 0.8; transform: translateZ(-30px) scale(1.15); }
    }

    /* Glow ring (orange) */
    .glow-ring {
      position: absolute; inset: -16px;
      border: 2px solid rgba(232, 145, 58, 0.25);
      border-radius: 50%;
      animation: glow-pulse 3s ease-in-out infinite;
    }
    .glow-ring-2 {
      position: absolute; inset: -32px;
      border: 1px solid rgba(139, 111, 71, 0.15);
      border-radius: 50%;
      animation: glow-pulse 3s ease-in-out infinite 0.5s;
    }
    @keyframes glow-pulse {
      0%, 100% { box-shadow: 0 0 25px var(--orange-glow); opacity: 0.6; transform: scale(1); }
      50% { box-shadow: 0 0 50px var(--orange-glow); opacity: 1; transform: scale(1.08); }
    }

    /* Hexagon ring (rotating) */
    .hex-ring {
      position: absolute; inset: -8px;
      border: 2px solid rgba(139, 111, 71, 0.2);
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      animation: hex-rotate 12s linear infinite;
      transform-style: preserve-3d;
    }
    @keyframes hex-rotate {
      0% { transform: rotate(0deg) translateZ(10px); border-color: rgba(139, 111, 71, 0.2); }
      50% { border-color: rgba(232, 145, 58, 0.4); }
      100% { transform: rotate(360deg) translateZ(10px); border-color: rgba(139, 111, 71, 0.2); }
    }

    /* Logo image */
    .logo-img {
      width: 200px; height: 200px;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(139, 111, 71, 0.2));
      animation: logo-float 4s ease-in-out infinite, logo-shimmer 3s ease-in-out infinite;
      position: relative; z-index: 2;
    }
    @keyframes logo-float {
      0%, 100% { transform: translateY(0px) rotateZ(0deg); }
      25% { transform: translateY(-8px) rotateZ(1deg); }
      50% { transform: translateY(-4px) rotateZ(-0.5deg); }
      75% { transform: translateY(-12px) rotateZ(0.5deg); }
    }
    @keyframes logo-shimmer {
      0%, 100% { filter: drop-shadow(0 4px 12px rgba(139, 111, 71, 0.2)) brightness(1); }
      50% { filter: drop-shadow(0 4px 20px rgba(232, 145, 58, 0.3)) brightness(1.05); }
    }

    /* Orbiting dots (3D) */
    .orbit {
      position: absolute; inset: -40px;
      animation: orbit-rotate 6s linear infinite;
      transform-style: preserve-3d;
    }
    .orbit-dot {
      position: absolute; width: 6px; height: 6px;
      background: var(--orange); border-radius: 50%;
      box-shadow: 0 0 10px var(--orange-glow);
    }
    .orbit-dot:nth-child(1) { top: 0; left: 50%; transform: translateX(-50%); }
    .orbit-dot:nth-child(2) { bottom: 0; left: 50%; transform: translateX(-50%); }
    .orbit-dot:nth-child(3) { top: 50%; left: 0; transform: translateY(-50%); }
    .orbit-dot:nth-child(4) { top: 50%; right: 0; transform: translateY(-50%); }
    @keyframes orbit-rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Text block */
    .logo-text-block { text-align: center; margin-top: 12px; position: relative; z-index: 2; }
    .logo-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 36px; font-weight: 700;
      letter-spacing: 8px; color: var(--text-dark);
      animation: text-reveal 1000ms cubic-bezier(0.16, 1, 0.3, 1) 0.9s both;
      clip-path: inset(0 100% 0 0);
      position: relative;
    }
    .logo-title::after {
      content: ''; position: absolute; bottom: -4px; left: 0;
      width: 0; height: 2px;
      background: linear-gradient(90deg, var(--orange), var(--brown));
      animation: underline-grow 800ms cubic-bezier(0.16, 1, 0.3, 1) 1.6s forwards;
    }
    @keyframes text-reveal { to { clip-path: inset(0 0% 0 0); } }
    @keyframes underline-grow { to { width: 100%; } }

    .logo-version {
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px; font-weight: 500;
      color: var(--orange); letter-spacing: 4px;
      margin-top: 6px;
      animation: fade-in 700ms ease-out 1.4s both; opacity: 0;
    }
    @keyframes fade-in { to { opacity: 1; } }

    .tagline {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 16px; color: var(--text-mid);
      letter-spacing: 2px; margin-top: 24px;
      animation: fade-in 700ms ease-out 1.8s both; opacity: 0;
    }

    /* Loading bar */
    .loading-track {
      position: absolute; bottom: 90px;
      width: 200px; height: 3px;
      background: rgba(139, 111, 71, 0.12);
      border-radius: 3px; overflow: hidden;
    }
    .loading-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--brown), var(--orange), var(--brown));
      background-size: 200% 100%;
      border-radius: 3px;
      animation: loading-progress 2.4s cubic-bezier(0.4, 0, 0.2, 1) forwards,
                 shimmer 1.8s linear infinite;
      width: 0;
    }
    @keyframes loading-progress { 0% { width: 0; } 100% { width: 100%; } }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* Corner accents (warm) */
    .corner-accent {
      position: absolute; width: 70px; height: 70px;
      border: 1.5px solid rgba(139, 111, 71, 0.2);
      animation: corner-pulse 3.5s ease-in-out infinite;
    }
    .corner-accent.tl { top: 50px; left: 50px; border-right: none; border-bottom: none; border-radius: 4px 0 0 0; }
    .corner-accent.br { bottom: 50px; right: 50px; border-left: none; border-top: none; border-radius: 0 0 4px 0; }
    @keyframes corner-pulse { 0%, 100% { opacity: 0.25; transform: scale(1); } 50% { opacity: 0.6; transform: scale(1.05); } }

    /* Exit */
    .splash-screen.exit .logo-3d { animation: logo-exit 600ms cubic-bezier(0.4, 0, 1, 1) forwards; }
    .splash-screen.exit .logo-title, .splash-screen.exit .logo-version,
    .splash-screen.exit .tagline, .splash-screen.exit .loading-track,
    .splash-screen.exit .logo-text-block { animation: fade-out 500ms ease-in forwards; }
    @keyframes logo-exit {
      to { transform: scale(0.8) translateY(-40px) rotateX(15deg) rotateY(5deg); opacity: 0; filter: blur(6px); }
    }
    @keyframes fade-out { to { opacity: 0; transform: translateY(10px); } }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .splash-screen { transition: none; }
      .logo-3d, .logo-img, .hex-ring, .logo-title, .logo-version, .tagline, .loading-fill,
      .particle, .glow-ring, .corner-accent, .orbit, .floating-shape, .bg-gradient-orb {
        animation: none !important; opacity: 1 !important; transform: none !important;
        clip-path: none !important; filter: none !important;
      }
      .loading-fill { width: 100%; }
      .hex-ring { transform: none; }
      .logo-title::after { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="splash-screen" id="splash">
    <div class="bg-layer">
      <div class="bg-gradient-orb orange"></div>
      <div class="bg-gradient-orb brown"></div>
      <div class="floating-shape s1"></div>
      <div class="floating-shape s2"></div>
      <div class="floating-shape s3"></div>
      <div class="floating-shape s4"></div>
    </div>

    <div class="corner-accent tl"></div>
    <div class="corner-accent br"></div>

    <div class="particles">
      <span class="particle" style="--i:0"></span><span class="particle" style="--i:1"></span>
      <span class="particle" style="--i:2"></span><span class="particle" style="--i:3"></span>
      <span class="particle" style="--i:4"></span><span class="particle" style="--i:5"></span>
      <span class="particle" style="--i:6"></span><span class="particle" style="--i:7"></span>
      <span class="particle" style="--i:8"></span><span class="particle" style="--i:9"></span>
      <span class="particle" style="--i:10"></span><span class="particle" style="--i:11"></span>
    </div>

    <div class="logo-stage">
      <div class="logo-3d">
        <div class="logo-container">
          <div class="logo-shadow"></div>
          <div class="glow-ring"></div>
          <div class="glow-ring-2"></div>
          <div class="hex-ring"></div>
          <div class="orbit">
            <div class="orbit-dot"></div>
            <div class="orbit-dot"></div>
            <div class="orbit-dot"></div>
            <div class="orbit-dot"></div>
          </div>
          <img src="./assets/rakshak-logo.png" alt="Rakshak 2.0 Logo" class="logo-img" />
        </div>
      </div>
    </div>

    <div class="logo-text-block">
      <div class="logo-title">RAKSHAK</div>
      <div class="logo-version">2.0</div>
    </div>
    <p class="tagline">Your brand's local guardian</p>

    <div class="loading-track"><div class="loading-fill"></div></div>
  </div>

  <script>
    const splash = document.getElementById('splash');
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const duration = reduced ? 500 : 3200;
    setTimeout(() => {
      splash.classList.add('exit');
      setTimeout(() => { splash.style.display = 'none'; }, 600);
    }, duration);
  </script>
</body>
</html>
