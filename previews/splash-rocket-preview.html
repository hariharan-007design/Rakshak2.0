<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rakshak 2.0 — Rocket Shield Intro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --white: #FFFFFF; --cream: #FAF7F2; --warm-bg: #F5F0E8;
      --brown-light: #A67C52; --brown: #8B6F47; --brown-dark: #6B5335;
      --orange: #E8913A; --orange-light: #F0A85A; --orange-glow: rgba(232, 145, 58, 0.3);
      --text-dark: #2C2416; --text-mid: #6B5335; --text-light: #9B8568;
      --silver: #C0C8D4; --silver-light: #E8ECF2; --silver-dark: #8A95A5;
      --blue: #3B82F6; --blue-light: #60A5FA; --blue-dark: #1D4ED8;
      --blue-glow: rgba(59, 130, 246, 0.35);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; font-family: 'Space Grotesk', sans-serif; background: #FAF7F2; }

    .splash-screen {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(135deg, #FAF7F2 0%, #F5F0E8 50%, #FFF8F0 100%);
      overflow: hidden; transition: opacity 600ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    .splash-screen.exit { opacity: 0; pointer-events: none; }

    /* ─── Background Layers ──────────────────────────────── */
    .bg-layer { position: absolute; inset: 0; pointer-events: none; transform-style: preserve-3d; }
    .bg-gradient-orb {
      position: absolute; width: 500px; height: 500px; border-radius: 50%;
      filter: blur(80px); opacity: 0.35; animation: orb-drift 6s ease-in-out infinite;
    }
    .bg-gradient-orb.orange { background: radial-gradient(circle, rgba(232, 145, 58, 0.4) 0%, transparent 70%); top: -100px; right: -100px; }
    .bg-gradient-orb.brown { background: radial-gradient(circle, rgba(139, 111, 71, 0.3) 0%, transparent 70%); bottom: -150px; left: -150px; animation-delay: -3s; }
    .bg-gradient-orb.blue { background: radial-gradient(circle, rgba(59, 130, 246, 0.2) 0%, transparent 70%); top: 30%; left: 20%; animation-delay: -1.5s; width: 300px; height: 300px; }
    @keyframes orb-drift { 0%, 100% { transform: translate(0, 0) scale(1); } 33% { transform: translate(30px, -20px) scale(1.05); } 66% { transform: translate(-20px, 15px) scale(0.95); } }

    .floating-shape { position: absolute; border-radius: 50%; opacity: 0.08; animation: shape-float 5s ease-in-out infinite; }
    .floating-shape.s1 { width: 80px; height: 80px; background: var(--orange); top: 15%; left: 10%; }
    .floating-shape.s2 { width: 50px; height: 50px; background: var(--brown); top: 70%; right: 15%; animation-delay: -1.5s; }
    .floating-shape.s3 { width: 120px; height: 120px; background: var(--orange-light); top: 20%; right: 8%; animation-delay: -3s; }
    .floating-shape.s4 { width: 40px; height: 40px; background: var(--brown-light); bottom: 25%; left: 12%; animation-delay: -2s; }
    @keyframes shape-float { 0%, 100% { transform: translateY(0px) rotate(0deg); } 25% { transform: translateY(-15px) rotate(5deg); } 50% { transform: translateY(-8px) rotate(-3deg); } 75% { transform: translateY(-20px) rotate(2deg); } }

    /* ─── Particles ──────────────────────────────────────── */
    .particles { position: absolute; inset: 0; pointer-events: none; }
    .particle {
      position: absolute; width: 4px; height: 4px; background: var(--orange);
      border-radius: 50%; top: 50%; left: 50%;
      animation: particle-float 3s ease-out infinite;
      animation-delay: calc(var(--i) * 0.18s);
      box-shadow: 0 0 8px var(--orange-glow); opacity: 0;
    }
    @keyframes particle-float {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
      10% { opacity: 0.8; }
      100% { transform: translate(calc(-50% + (cos(var(--i) * 0.5236) * 180px)), calc(-50% + (sin(var(--i) * 0.5236) * 120px))) scale(0); opacity: 0; }
    }

    /* ─── Rocket Shield (flies around, lands behind logo) ── */
    .rocket-stage {
      position: absolute; inset: 0;
      pointer-events: none; z-index: 4;
      overflow: visible;
    }
    .rocket-shield {
      position: absolute;
      width: 120px; height: 135px;
      animation: rocket-flight 3.8s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
      opacity: 0;
      transform-origin: center center;
    }
    @keyframes rocket-flight {
      /* Start: bottom-left, small, angled up */
      0% { left: 5%; top: 85%; transform: rotate(-30deg) scale(0.5); opacity: 0; }
      5% { opacity: 1; }
      /* Fly up and right (rocket arc) */
      15% { left: 20%; top: 30%; transform: rotate(-15deg) scale(0.8); }
      25% { left: 45%; top: 10%; transform: rotate(0deg) scale(1.0); }
      /* Sweep across top */
      35% { left: 70%; top: 15%; transform: rotate(15deg) scale(1.05); }
      45% { left: 85%; top: 40%; transform: rotate(30deg) scale(1.0); }
      /* Dive down right side */
      55% { left: 75%; top: 65%; transform: rotate(45deg) scale(0.95); }
      65% { left: 50%; top: 75%; transform: rotate(15deg) scale(0.9); }
      /* Curve back to center, landing behind logo */
      75% { left: 35%; top: 55%; transform: rotate(-10deg) scale(0.85); }
      85% { left: 42%; top: 48%; transform: rotate(-5deg) scale(0.8); opacity: 0.9; }
      92% { left: 46%; top: 46%; transform: rotate(0deg) scale(0.75); opacity: 0.7; }
      /* Final: behind logo, centered */
      100% { left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(0deg) scale(0.85); opacity: 0.25; }
    }

    /* Shield body (silver + blue gradient) */
    .shield-body {
      width: 100%; height: 100%;
      position: relative;
      background: linear-gradient(135deg, #C0C8D4 0%, #E8ECF2 25%, #8A95A5 50%, #3B82F6 75%, #1D4ED8 100%);
      clip-path: polygon(50% 0%, 100% 15%, 100% 60%, 50% 100%, 0% 60%, 0% 15%);
      box-shadow: 
        0 8px 32px rgba(59, 130, 246, 0.4),
        inset 0 2px 8px rgba(255, 255, 255, 0.3),
        inset 0 -4px 12px rgba(0, 0, 0, 0.15);
      animation: shield-glow 2s ease-in-out infinite;
      transform-style: preserve-3d;
    }
    @keyframes shield-glow {
      0%, 100% { box-shadow: 0 8px 32px rgba(59, 130, 246, 0.4), inset 0 2px 8px rgba(255,255,255,0.3), inset 0 -4px 12px rgba(0,0,0,0.15); }
      50% { box-shadow: 0 12px 48px rgba(59, 130, 246, 0.6), inset 0 2px 8px rgba(255,255,255,0.4), inset 0 -4px 12px rgba(0,0,0,0.15); }
    }

    /* Shield inner highlight */
    .shield-inner {
      position: absolute; inset: 8px;
      background: linear-gradient(135deg, rgba(255,255,255,0.25) 0%, transparent 50%, rgba(59,130,246,0.1) 100%);
      clip-path: polygon(50% 0%, 100% 15%, 100% 60%, 50% 100%, 0% 60%, 0% 15%);
      pointer-events: none;
    }

    /* Shield border (animated shimmer) */
    .shield-border {
      position: absolute; inset: -3px;
      clip-path: polygon(50% 0%, 100% 15%, 100% 60%, 50% 100%, 0% 60%, 0% 15%);
      background: linear-gradient(135deg, var(--blue-light), var(--silver), var(--blue), var(--silver-light));
      background-size: 300% 300%;
      animation: border-shimmer 2.5s linear infinite;
      z-index: -1;
      opacity: 0.7;
    }
    @keyframes border-shimmer {
      0% { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    /* Shield checkmark */
    .shield-check {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -45%);
      width: 36px; height: 36px;
    }
    .shield-check svg { width: 100%; height: 100%; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }
    .shield-check path {
      stroke: rgba(255, 255, 255, 0.95); stroke-width: 3.5;
      stroke-linecap: round; stroke-linejoin: round; fill: none;
      stroke-dasharray: 50; stroke-dashoffset: 50;
      animation: check-draw 800ms cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
    }
    @keyframes check-draw { to { stroke-dashoffset: 0; } }

    /* Rocket trail (transparent transition) */
    .rocket-trail {
      position: absolute; inset: -15px;
      clip-path: polygon(50% 0%, 100% 15%, 100% 60%, 50% 100%, 0% 60%, 0% 15%);
      background: radial-gradient(ellipse at center, rgba(59, 130, 246, 0.3) 0%, transparent 70%);
      animation: trail-pulse 1.2s ease-in-out infinite;
      opacity: 0;
    }
    @keyframes trail-pulse {
      0%, 100% { opacity: 0.15; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
    }

    /* Rocket exhaust (behind shield during flight) */
    .rocket-exhaust {
      position: absolute; bottom: -20px; left: 50%;
      transform: translateX(-50%);
      width: 8px; height: 0;
      background: linear-gradient(to bottom, rgba(232, 145, 58, 0.8), transparent);
      border-radius: 4px;
      animation: exhaust-flame 0.3s ease-in-out infinite alternate;
    }
    @keyframes exhaust-flame {
      0% { height: 20px; opacity: 0.8; }
      100% { height: 35px; opacity: 0.4; }
    }

    /* ─── 3D Logo Stage ──────────────────────────────────── */
    .logo-stage { perspective: 1200px; perspective-origin: 50% 45%; margin-bottom: 24px; position: relative; z-index: 5; }
    .logo-3d { transform-style: preserve-3d; animation: logo-entrance 1600ms cubic-bezier(0.16, 1, 0.3, 1) forwards; position: relative; }
    @keyframes logo-entrance {
      0% { transform: rotateY(-150deg) rotateX(25deg) rotateZ(-10deg) scale(0.4) translateZ(-200px); opacity: 0; filter: blur(12px); }
      40% { transform: rotateY(15deg) rotateX(-5deg) rotateZ(3deg) scale(1.12) translateZ(20px); opacity: 1; filter: blur(0); }
      70% { transform: rotateY(-5deg) rotateX(2deg) rotateZ(-1deg) scale(1.02) translateZ(0px); }
      100% { transform: rotateY(0deg) rotateX(0deg) rotateZ(0deg) scale(1) translateZ(0px); opacity: 1; filter: blur(0); }
    }

    .logo-container { position: relative; width: 240px; height: 240px; display: flex; align-items: center; justify-content: center; transform-style: preserve-3d; }
    .logo-shadow { position: absolute; inset: 0; background: radial-gradient(circle, rgba(139, 111, 71, 0.2) 0%, transparent 60%); transform: translateZ(-30px) scale(1.1); filter: blur(20px); animation: shadow-pulse 3s ease-in-out infinite; }
    @keyframes shadow-pulse { 0%, 100% { opacity: 0.5; transform: translateZ(-30px) scale(1.1); } 50% { opacity: 0.8; transform: translateZ(-30px) scale(1.15); } }

    .glow-ring { position: absolute; inset: -16px; border: 2px solid rgba(232, 145, 58, 0.25); border-radius: 50%; animation: glow-pulse 3s ease-in-out infinite; }
    .glow-ring-2 { position: absolute; inset: -32px; border: 1px solid rgba(139, 111, 71, 0.15); border-radius: 50%; animation: glow-pulse 3s ease-in-out infinite 0.5s; }
    @keyframes glow-pulse { 0%, 100% { box-shadow: 0 0 25px var(--orange-glow); opacity: 0.6; transform: scale(1); } 50% { box-shadow: 0 0 50px var(--orange-glow); opacity: 1; transform: scale(1.08); } }

    .hex-ring { position: absolute; inset: -8px; border: 2px solid rgba(139, 111, 71, 0.2); clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); animation: hex-rotate 12s linear infinite; transform-style: preserve-3d; }
    @keyframes hex-rotate { 0% { transform: rotate(0deg) translateZ(10px); border-color: rgba(139, 111, 71, 0.2); } 50% { border-color: rgba(232, 145, 58, 0.4); } 100% { transform: rotate(360deg) translateZ(10px); border-color: rgba(139, 111, 71, 0.2); } }

    .logo-img { width: 200px; height: 200px; object-fit: contain; filter: drop-shadow(0 4px 12px rgba(139, 111, 71, 0.2)); animation: logo-float 4s ease-in-out infinite, logo-shimmer 3s ease-in-out infinite; position: relative; z-index: 2; }
    @keyframes logo-float { 0%, 100% { transform: translateY(0px) rotateZ(0deg); } 25% { transform: translateY(-8px) rotateZ(1deg); } 50% { transform: translateY(-4px) rotateZ(-0.5deg); } 75% { transform: translateY(-12px) rotateZ(0.5deg); } }
    @keyframes logo-shimmer { 0%, 100% { filter: drop-shadow(0 4px 12px rgba(139, 111, 71, 0.2)) brightness(1); } 50% { filter: drop-shadow(0 4px 20px rgba(232, 145, 58, 0.3)) brightness(1.05); } }

    .orbit { position: absolute; inset: -40px; animation: orbit-rotate 6s linear infinite; transform-style: preserve-3d; }
    .orbit-dot { position: absolute; width: 6px; height: 6px; background: var(--orange); border-radius: 50%; box-shadow: 0 0 10px var(--orange-glow); }
    .orbit-dot:nth-child(1) { top: 0; left: 50%; transform: translateX(-50%); }
    .orbit-dot:nth-child(2) { bottom: 0; left: 50%; transform: translateX(-50%); }
    .orbit-dot:nth-child(3) { top: 50%; left: 0; transform: translateY(-50%); }
    .orbit-dot:nth-child(4) { top: 50%; right: 0; transform: translateY(-50%); }
    @keyframes orbit-rotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* ─── Text ───────────────────────────────────────────── */
    .logo-text-block { text-align: center; margin-top: 12px; position: relative; z-index: 6; }
    .logo-title { font-family: 'Space Grotesk', sans-serif; font-size: 36px; font-weight: 700; letter-spacing: 8px; color: var(--text-dark); animation: text-reveal 1000ms cubic-bezier(0.16, 1, 0.3, 1) 0.9s both; clip-path: inset(0 100% 0 0); position: relative; }
    .logo-title::after { content: ''; position: absolute; bottom: -4px; left: 0; width: 0; height: 2px; background: linear-gradient(90deg, var(--orange), var(--brown)); animation: underline-grow 800ms cubic-bezier(0.16, 1, 0.3, 1) 1.6s forwards; }
    @keyframes text-reveal { to { clip-path: inset(0 0% 0 0); } }
    @keyframes underline-grow { to { width: 100%; } }

    .logo-version { font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 500; color: var(--orange); letter-spacing: 4px; margin-top: 6px; animation: fade-in 700ms ease-out 1.4s both; opacity: 0; }
    @keyframes fade-in { to { opacity: 1; } }

    .tagline { font-family: 'Space Grotesk', sans-serif; font-size: 16px; color: var(--text-mid); letter-spacing: 2px; margin-top: 24px; animation: fade-in 700ms ease-out 1.8s both; opacity: 0; }

    /* ─── Loading bar ────────────────────────────────────── */
    .loading-track { position: absolute; bottom: 90px; width: 200px; height: 3px; background: rgba(139, 111, 71, 0.12); border-radius: 3px; overflow: hidden; z-index: 6; }
    .loading-fill { height: 100%; background: linear-gradient(90deg, var(--brown), var(--orange), var(--brown)); background-size: 200% 100%; border-radius: 3px; animation: loading-progress 2.4s cubic-bezier(0.4, 0, 0.2, 1) forwards, shimmer 1.8s linear infinite; width: 0; }
    @keyframes loading-progress { 0% { width: 0; } 100% { width: 100%; } }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* ─── Corner accents ─────────────────────────────────── */
    .corner-accent { position: absolute; width: 70px; height: 70px; border: 1.5px solid rgba(139, 111, 71, 0.2); animation: corner-pulse 3.5s ease-in-out infinite; z-index: 6; }
    .corner-accent.tl { top: 50px; left: 50px; border-right: none; border-bottom: none; border-radius: 4px 0 0 0; }
    .corner-accent.br { bottom: 50px; right: 50px; border-left: none; border-top: none; border-radius: 0 0 4px 0; }
    @keyframes corner-pulse { 0%, 100% { opacity: 0.25; transform: scale(1); } 50% { opacity: 0.6; transform: scale(1.05); } }

    /* ─── Exit ───────────────────────────────────────────── */
    .splash-screen.exit .logo-3d { animation: logo-exit 600ms cubic-bezier(0.4, 0, 1, 1) forwards; }
    .splash-screen.exit .logo-title, .splash-screen.exit .logo-version,
    .splash-screen.exit .tagline, .splash-screen.exit .loading-track,
    .splash-screen.exit .logo-text-block { animation: fade-out 500ms ease-in forwards; }
    .splash-screen.exit .rocket-shield { animation: rocket-exit 500ms ease-in forwards; }
    @keyframes logo-exit { to { transform: scale(0.8) translateY(-40px) rotateX(15deg) rotateY(5deg); opacity: 0; filter: blur(6px); } }
    @keyframes fade-out { to { opacity: 0; transform: translateY(10px); } }
    @keyframes rocket-exit { to { opacity: 0; transform: scale(0.2) rotate(720deg) translateZ(-300px); } }

    /* ─── Reduced motion ─────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      .splash-screen { transition: none; }
      .logo-3d, .logo-img, .hex-ring, .logo-title, .logo-version, .tagline, .loading-fill,
      .particle, .glow-ring, .corner-accent, .orbit, .floating-shape, .bg-gradient-orb, .rocket-shield, .shield-body, .rocket-trail {
        animation: none !important; opacity: 1 !important; transform: none !important;
        clip-path: none !important; filter: none !important;
      }
      .loading-fill { width: 100%; }
      .hex-ring { transform: none; }
      .logo-title::after { width: 100%; }
      .rocket-shield { opacity: 0.25; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(0.85); }
      .rocket-trail { display: none; }
    }
  </style>
</head>
<body>
  <div class="splash-screen" id="splash">
    <div class="bg-layer">
      <div class="bg-gradient-orb orange"></div>
      <div class="bg-gradient-orb brown"></div>
      <div class="bg-gradient-orb blue"></div>
      <div class="floating-shape s1"></div>
      <div class="floating-shape s2"></div>
      <div class="floating-shape s3"></div>
      <div class="floating-shape s4"></div>
    </div>

    <div class="corner-accent tl"></div>
    <div class="corner-accent br"></div>

    <div class="particles">
      <span class="particle" style="--i:0"></span><span class="particle" style="--i:1"></span>
      <span class="particle" style="--i:2"></span><span class="particle" style="--i:3"></span>
      <span class="particle" style="--i:4"></span><span class="particle" style="--i:5"></span>
      <span class="particle" style="--i:6"></span><span class="particle" style="--i:7"></span>
      <span class="particle" style="--i:8"></span><span class="particle" style="--i:9"></span>
      <span class="particle" style="--i:10"></span><span class="particle" style="--i:11"></span>
    </div>

    <!-- Rocket Shield: flies around screen, lands behind logo -->
    <div class="rocket-stage">
      <div class="rocket-shield">
        <div class="rocket-trail"></div>
        <div class="shield-border"></div>
        <div class="shield-body">
          <div class="shield-inner"></div>
          <div class="shield-check">
            <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M10 20 L16 26 L30 12" />
            </svg>
          </div>
        </div>
        <div class="rocket-exhaust"></div>
      </div>
    </div>

    <div class="logo-stage">
      <div class="logo-3d">
        <div class="logo-container">
          <div class="logo-shadow"></div>
          <div class="glow-ring"></div>
          <div class="glow-ring-2"></div>
          <div class="hex-ring"></div>
          <div class="orbit">
            <div class="orbit-dot"></div><div class="orbit-dot"></div>
            <div class="orbit-dot"></div><div class="orbit-dot"></div>
          </div>
          <img src="./assets/rakshak-logo.png" alt="Rakshak 2.0 Logo" class="logo-img" />
        </div>
      </div>
    </div>

    <div class="logo-text-block">
      <div class="logo-title">RAKSHAK</div>
      <div class="logo-version">2.0</div>
    </div>
    <p class="tagline">Your brand guardian</p>

    <div class="loading-track"><div class="loading-fill"></div></div>
  </div>

  <script>
    const splash = document.getElementById('splash');
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const duration = reduced ? 500 : 4200;
    setTimeout(() => {
      splash.classList.add('exit');
      setTimeout(() => { splash.style.display = 'none'; }, 600);
    }, duration);
  </script>
</body>
</html>
