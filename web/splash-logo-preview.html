<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rakshak 2.0 — 3D Animated Intro (Logo)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cyan: #06B6D4; --cyan-dark: #0891B2; --navy: #0F172A;
      --navy-light: #1E293B; --slate-50: #F8FAFC; --slate-400: #94A3B8; --slate-700: #334155;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; font-family: 'Space Grotesk', sans-serif; background: #020617; }

    .splash-screen {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: radial-gradient(ellipse at center, #0F172A 0%, #020617 100%);
      overflow: hidden; transition: opacity 500ms ease-out;
    }
    .splash-screen.exit { opacity: 0; pointer-events: none; }

    .particles { position: absolute; inset: 0; pointer-events: none; }
    .particle {
      position: absolute; width: 3px; height: 3px;
      background: rgba(6, 182, 212, 0.7); border-radius: 50%;
      top: 50%; left: 50%;
      animation: particle-float 2.5s ease-out infinite;
      animation-delay: calc(var(--i) * 0.12s);
      box-shadow: 0 0 6px rgba(6, 182, 212, 0.4);
    }
    @keyframes particle-float {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
      15% { opacity: 1; }
      100% {
        transform: translate(
          calc(-50% + (cos(var(--i) * 0.5236) * 150px)),
          calc(-50% + (sin(var(--i) * 0.5236) * 100px))
        ) scale(0);
        opacity: 0;
      }
    }

    .logo-stage { perspective: 1000px; perspective-origin: 50% 50%; margin-bottom: 16px; }
    .logo-3d { transform-style: preserve-3d; animation: logo-entrance 1400ms cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes logo-entrance {
      0% { transform: rotateY(-120deg) rotateX(20deg) scale(0.5); opacity: 0; filter: blur(8px); }
      50% { transform: rotateY(12deg) rotateX(-4deg) scale(1.08); opacity: 1; filter: blur(0); }
      100% { transform: rotateY(0deg) rotateX(0deg) scale(1); opacity: 1; filter: blur(0); }
    }

    .logo-container { position: relative; width: 220px; height: 220px; display: flex; align-items: center; justify-content: center; }
    .logo-glow {
      position: absolute; inset: -20px;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.25) 0%, transparent 70%);
      animation: glow-pulse 2.5s ease-in-out infinite; border-radius: 50%;
    }
    @keyframes glow-pulse { 0%, 100% { opacity: 0.6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.15); } }
    .logo-img {
      width: 200px; height: 200px; object-fit: contain;
      filter: drop-shadow(0 0 20px rgba(6, 182, 212, 0.3));
      animation: logo-float 3s ease-in-out infinite;
    }
    @keyframes logo-float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-6px); } }

    .hex-ring {
      position: absolute; inset: -12px;
      border: 2px solid rgba(6, 182, 212, 0.3);
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      animation: hex-rotate 8s linear infinite;
    }
    @keyframes hex-rotate {
      0% { transform: rotate(0deg); border-color: rgba(6, 182, 212, 0.3); }
      50% { border-color: rgba(6, 182, 212, 0.6); }
      100% { transform: rotate(360deg); border-color: rgba(6, 182, 212, 0.3); }
    }

    .logo-text-block { text-align: center; margin-top: 8px; }
    .logo-title {
      font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 700;
      letter-spacing: 6px; color: #F8FAFC;
      animation: text-reveal 900ms cubic-bezier(0.16, 1, 0.3, 1) 0.7s both;
      clip-path: inset(0 100% 0 0);
    }
    @keyframes text-reveal { to { clip-path: inset(0 0% 0 0); } }
    .logo-version {
      font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 500;
      color: #06B6D4; letter-spacing: 3px; margin-top: 4px;
      animation: fade-in 600ms ease-out 1.2s both; opacity: 0;
    }
    @keyframes fade-in { to { opacity: 1; } }
    .tagline {
      font-family: 'Space Grotesk', sans-serif; font-size: 15px; color: #94A3B8;
      letter-spacing: 1.5px; margin-top: 20px;
      animation: fade-in 600ms ease-out 1.5s both; opacity: 0;
    }

    .loading-track { position: absolute; bottom: 80px; width: 180px; height: 2px; background: rgba(51, 65, 85, 0.4); border-radius: 2px; overflow: hidden; }
    .loading-fill {
      height: 100%; background: linear-gradient(90deg, #06B6D4, #0891B2, #06B6D4);
      background-size: 200% 100%; border-radius: 2px;
      animation: loading-progress 2.2s cubic-bezier(0.4, 0, 0.2, 1) forwards, shimmer 1.5s linear infinite;
      width: 0;
    }
    @keyframes loading-progress { 0% { width: 0; } 100% { width: 100%; } }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    .corner-accent { position: absolute; width: 60px; height: 60px; border: 1px solid rgba(6, 182, 212, 0.15); animation: corner-pulse 3s ease-in-out infinite; }
    .corner-accent.tl { top: 40px; left: 40px; border-right: none; border-bottom: none; }
    .corner-accent.br { bottom: 40px; right: 40px; border-left: none; border-top: none; }
    @keyframes corner-pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.7; } }

    .splash-screen.exit .logo-3d { animation: logo-exit 500ms cubic-bezier(0.4, 0, 1, 1) forwards; }
    .splash-screen.exit .logo-title, .splash-screen.exit .logo-version, .splash-screen.exit .tagline, .splash-screen.exit .loading-track { animation: fade-out 400ms ease-in forwards; }
    @keyframes logo-exit { to { transform: scale(0.85) translateY(-30px) rotateX(10deg); opacity: 0; filter: blur(4px); } }
    @keyframes fade-out { to { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .splash-screen { transition: none; }
      .logo-3d, .logo-img, .hex-ring, .logo-title, .logo-version, .tagline, .loading-fill, .particle, .glow-ring, .corner-accent {
        animation: none !important; opacity: 1 !important; transform: none !important; clip-path: none !important; filter: none !important;
      }
      .loading-fill { width: 100%; }
      .hex-ring { transform: none; }
    }
  </style>
</head>
<body>
  <div class="splash-screen" id="splash">
    <div class="corner-accent tl"></div>
    <div class="corner-accent br"></div>
    <div class="particles">
      <span class="particle" style="--i:0"></span><span class="particle" style="--i:1"></span>
      <span class="particle" style="--i:2"></span><span class="particle" style="--i:3"></span>
      <span class="particle" style="--i:4"></span><span class="particle" style="--i:5"></span>
      <span class="particle" style="--i:6"></span><span class="particle" style="--i:7"></span>
      <span class="particle" style="--i:8"></span><span class="particle" style="--i:9"></span>
      <span class="particle" style="--i:10"></span><span class="particle" style="--i:11"></span>
    </div>
    <div class="logo-stage">
      <div class="logo-3d">
        <div class="logo-container">
          <div class="logo-glow"></div>
          <div class="hex-ring"></div>
          <img src="./assets/rakshak-logo.png" alt="Rakshak 2.0 Logo" class="logo-img" />
        </div>
      </div>
    </div>
    <div class="logo-text-block">
      <div class="logo-title">RAKSHAK</div>
      <div class="logo-version">2.0</div>
    </div>
    <p class="tagline">Your brand's local guardian</p>
    <div class="loading-track"><div class="loading-fill"></div></div>
  </div>
  <script>
    const splash = document.getElementById('splash');
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const duration = reduced ? 400 : 2800;
    setTimeout(() => {
      splash.classList.add('exit');
      setTimeout(() => { splash.style.display = 'none'; }, 500);
    }, duration);
  </script>
</body>
</html>
